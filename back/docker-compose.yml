services:
  db:
    image: postgres:17-alpine
    container_name: kazik-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kazik}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kazik}
      POSTGRES_DB: ${POSTGRES_DB:-kazik}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kazik} -d ${POSTGRES_DB:-kazik}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: kazik-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:

