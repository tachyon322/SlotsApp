services:
  db:
    image: postgres:17-alpine
    container_name: kazik-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kazik}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kazik}
      POSTGRES_DB: ${POSTGRES_DB:-kazik}
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kazik} -d ${POSTGRES_DB:-kazik}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: kazik-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./back
    container_name: kazik-backend
    restart: unless-stopped
    env_file:
      - ./back/.env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-kazik}:${POSTGRES_PASSWORD:-kazik}@db:5432/${POSTGRES_DB:-kazik}
      REDIS_URL: redis://redis:6379
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./front
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    container_name: kazik-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
