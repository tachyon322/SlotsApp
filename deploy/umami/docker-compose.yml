# Umami 3.4.1 — собственная веб-аналитика (litxgame.com и следующие проекты).
#
# Секреты лежат вне репозитория:
#   docker compose -f /var/www/SlotsApp/deploy/umami/docker-compose.yml \
#     --env-file /var/www/umami/.env up -d
#
# Один инстанс обслуживает несколько сайтов: каждый проект — отдельная запись
# website со своим UUID в data-website-id, отдельного развёртывания не нужно.
#
# Наружу не публикуется: слушает 127.0.0.1:3050, снаружи — только Caddy.
name: umami

services:
  umami:
    image: ghcr.io/umami-software/umami:3.4.1
    container_name: umami
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD}@umami-db:5432/umami
      APP_SECRET: ${APP_SECRET}
      TWO_FACTOR_ENCRYPTION_KEY: ${TWO_FACTOR_ENCRYPTION_KEY}
      DISABLE_TELEMETRY: "1"
      CLIENT_IP_HEADER: X-Forwarded-For
    ports:
      - "127.0.0.1:3050:3000"
    depends_on:
      umami-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/api/heartbeat || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

  umami-db:
    image: postgres:17-alpine
    container_name: umami-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${UMAMI_DB_PASSWORD}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - umami-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami -d umami"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  umami-db-data:
